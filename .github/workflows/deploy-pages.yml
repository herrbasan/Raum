# Deploys dist/ to GitHub Pages on every push to master.
# Additive deploy path only — local `node tools/build.mjs` + folder-sync hosting stays untouched.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node tools/build.mjs

      - name: Validate JSON-LD
        run: node tools/validate-jsonld.mjs

      # CNAME is generated here, not in build.mjs, so local dist/ output stays unchanged.
      - name: Create CNAME
        run: echo "raum.com" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

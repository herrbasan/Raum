<text class="t-title" x="52" y="79.58" text-anchor="start" textLength="368.86" lengthAdjust="spacingAndGlyphs">Produktion ist nicht Zugang</text>
<g transform="translate(52 109)">
<text class="t-group nc-dim" x="214.05" y="23.52" text-anchor="start" textLength="62.91" lengthAdjust="spacingAndGlyphs">Produktion</text>
<text class="t-group nc-dim" x="521.12" y="23.52" text-anchor="start" textLength="40.29" lengthAdjust="spacingAndGlyphs">Zugang</text>
<line class="nc-rule" x1="0" y1="38.4" x2="856" y2="38.4"/>
<text class="t-label nc-ink" x="0" y="66.56" text-anchor="start" textLength="44.5" lengthAdjust="spacingAndGlyphs">Frage</text>
<text class="t-detail nc-dim" x="214.05" y="64.89" text-anchor="start" textLength="173.74" lengthAdjust="spacingAndGlyphs">Was können wir herstellen?</text>
<text class="t-detail nc-dim" x="521.12" y="64.89" text-anchor="start" textLength="128.8" lengthAdjust="spacingAndGlyphs">Wer kann es nutzen?</text>
<line class="nc-rule" x1="0" y1="104" x2="856" y2="104"/>
<text class="t-label nc-ink" x="0" y="132.16" text-anchor="start" textLength="156.72" lengthAdjust="spacingAndGlyphs">Heutige Verknüpfung</text>
<text class="t-detail nc-dim" x="214.05" y="130.49" text-anchor="start" textLength="229.74" lengthAdjust="spacingAndGlyphs">Menschliche Arbeit erzeugt Output</text>
<text class="t-detail nc-dim" x="521.12" y="130.49" text-anchor="start" textLength="137.48" lengthAdjust="spacingAndGlyphs">Löhne kaufen Output</text>
<line class="nc-rule" x1="0" y1="169.6" x2="856" y2="169.6"/>
<text class="t-label nc-ink" x="0" y="197.76" text-anchor="start" textLength="156.39" lengthAdjust="spacingAndGlyphs">Wenn Arbeit an Wert</text>
<text class="t-label nc-ink" x="0" y="218.56" text-anchor="start" textLength="59.44" lengthAdjust="spacingAndGlyphs">verliert</text>
<text class="t-detail nc-dim" x="214.05" y="196.09" text-anchor="start" textLength="180.32" lengthAdjust="spacingAndGlyphs">Output kann weiter steigen</text>
<text class="t-detail nc-dim" x="521.12" y="196.09" text-anchor="start" textLength="318.5" lengthAdjust="spacingAndGlyphs">Eigentum, Dienste und Ansprüche werden wichtig</text>
<line class="nc-rule" x1="0" y1="235.2" x2="856" y2="235.2"/>
<text class="t-label nc-ink" x="0" y="263.36" text-anchor="start" textLength="89.81" lengthAdjust="spacingAndGlyphs">Wenn beides</text>
<text class="t-label nc-ink" x="0" y="284.16" text-anchor="start" textLength="127" lengthAdjust="spacingAndGlyphs">auseinanderläuft</text>
<text class="t-detail nc-dim" x="214.05" y="261.69" text-anchor="start" textLength="258.86" lengthAdjust="spacingAndGlyphs">Überkapazität und ungenutztes Angebot</text>
<text class="t-detail nc-dim" x="521.12" y="261.69" text-anchor="start" textLength="206.92" lengthAdjust="spacingAndGlyphs">Leere Geldbörsen und verlorene</text>
<text class="t-detail nc-dim" x="521.12" y="280.59" text-anchor="start" textLength="126.7" lengthAdjust="spacingAndGlyphs">Verhandlungsmacht</text>
<line class="nc-rule" x1="0" y1="300.8" x2="856" y2="300.8"/>





</g>
<text class="t-caption nc-dim" x="52" y="444.64" text-anchor="start" textLength="442.82" lengthAdjust="spacingAndGlyphs">Mehr Output hilft nur, wenn Menschen einen Anspruch darauf haben.</text>

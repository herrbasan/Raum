<g transform="translate(52 109)">
<text class="t-group nc-dim" x="0" y="23.52" text-anchor="start" textLength="31.64" lengthAdjust="spacingAndGlyphs">Limit</text>
<text class="t-group nc-dim" x="237.52" y="23.52" text-anchor="start" textLength="27.44" lengthAdjust="spacingAndGlyphs">Test</text>
<text class="t-group nc-dim" x="589.33" y="23.52" text-anchor="start" textLength="53.15" lengthAdjust="spacingAndGlyphs">Response</text>
<line class="nc-rule" x1="0" y1="38.4" x2="856" y2="38.4"/>
<text class="t-label nc-ink" x="0" y="66.56" text-anchor="start" textLength="147.3" lengthAdjust="spacingAndGlyphs">Physical / ecological</text>
<text class="t-detail nc-dim" x="237.52" y="64.89" text-anchor="start" textLength="168.98" lengthAdjust="spacingAndGlyphs">What does nature require?</text>
<text class="t-detail nc-dim" x="589.33" y="64.89" text-anchor="start" textLength="174.3" lengthAdjust="spacingAndGlyphs">Engineer within the budget</text>
<line class="nc-rule" x1="0" y1="83.2" x2="856" y2="83.2"/>
<text class="t-label nc-ink" x="0" y="111.36" text-anchor="start" textLength="93.54" lengthAdjust="spacingAndGlyphs">Institutional</text>
<text class="t-detail nc-dim" x="237.52" y="109.69" text-anchor="start" textLength="231.28" lengthAdjust="spacingAndGlyphs">What rule or incentive preserves it?</text>
<text class="t-detail nc-dim" x="589.33" y="109.69" text-anchor="start" textLength="147.84" lengthAdjust="spacingAndGlyphs">Redesign or coordinate</text>
<line class="nc-rule" x1="0" y1="128" x2="856" y2="128"/>
<text class="t-label nc-ink" x="0" y="156.16" text-anchor="start" textLength="74.54" lengthAdjust="spacingAndGlyphs">Positional</text>
<text class="t-detail nc-dim" x="237.52" y="154.49" text-anchor="start" textLength="192.08" lengthAdjust="spacingAndGlyphs">Does its value depend on rank?</text>
<text class="t-detail nc-dim" x="589.33" y="154.49" text-anchor="start" textLength="156.8" lengthAdjust="spacingAndGlyphs">Limit what rank can buy</text>
<line class="nc-rule" x1="0" y1="172.8" x2="856" y2="172.8"/>





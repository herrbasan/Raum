<!-- Wire labels follow one rule: above the final horizontal run, right-aligned
     to the turn. A wire with no horizontal run gets its label beside the line,
     just above the arrowhead. Hand-placed labels drift off their own wire. -->

<!-- the memory writes what it keeps to nDB -->
<path class="wire" d="M64,392 L32,392 L32,600 L330,600 L330,649"/>
<text class="m" x="322" y="592" text-anchor="end">what it remembers</text>

<!-- the storage box is indexed into nVDB -->
<path class="wire" d="M534,548 L534,649"/>
<text class="m" x="542" y="645">indexed</text>

<!-- raum_tts hands its audio to nMedia -->
<path class="wire" d="M1136,392 L1176,392 L1176,600 L972,600 L972,649"/>
<text class="m" x="964" y="592" text-anchor="end">media work</text>

<line class="rule" x1="56" y1="806" x2="1144" y2="806"/>
<text class="m" x="56" y="832">nDB and nVDB are written in Rust — they run in memory, with disk persistence</text>
<text class="m" x="56" y="854">the workshop runs on Badkid · the small work runs on two of his own models — Gemini 4 27B, and Qwen3 Embedding 4B on Fatten</text>
</svg>

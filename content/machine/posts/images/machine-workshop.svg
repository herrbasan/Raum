<text class="h" x="956" y="488">pdf_extract</text>
<text class="s" x="956" y="510">a PDF becomes</text>
<text class="m" x="956" y="530">text</text>

<!-- what it stands on -->
<rect class="card" x="56" y="656" width="344" height="120" rx="5"/>
<text class="h" x="80" y="692">nDB</text>
<text class="s" x="80" y="716">a schemaless document database</text>
<text class="m" x="80" y="738">the storage box's documents</text>

<rect class="card" x="428" y="656" width="344" height="120" rx="5"/>
<text class="h" x="452" y="692">nVDB</text>
